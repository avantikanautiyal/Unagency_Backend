apiVersion: v1
kind: Secret
metadata:
  name: unagency-secrets
  namespace: unagency
type: Opaque
stringData:
  DATABASE_URL: "postgres://unagency:CHANGE_ME@postgres:5432/unagency"
  MONGODB_URI: "mongodb://unagency:CHANGE_ME@mongodb:27017/unagency?authSource=admin"
  REDIS_PASSWORD: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  MONGO_PASSWORD: "CHANGE_ME"
  JWT_SIGNING_KEY: "CHANGE_ME"
