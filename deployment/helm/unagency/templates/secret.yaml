apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "postgres://unagency:CHANGE_ME@postgres:5432/unagency" | quote }}
  MONGODB_URI: {{ .Values.secrets.mongodbUri | default "mongodb://unagency:CHANGE_ME@mongodb:27017/unagency?authSource=admin" | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "CHANGE_ME" | quote }}
