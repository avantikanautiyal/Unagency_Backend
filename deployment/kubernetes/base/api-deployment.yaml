apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: unagency
  labels: { app: api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: unagency/platform:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_ROLE, value: api }
          envFrom:
            - configMapRef: { name: unagency-config }
            - secretRef: { name: unagency-secrets }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: unagency
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
