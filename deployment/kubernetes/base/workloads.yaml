apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: unagency
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: worker
          image: unagency/platform:1.0.0
          env:
            - { name: SERVICE_ROLE, value: worker }
          envFrom:
            - configMapRef: { name: unagency-config }
            - secretRef: { name: unagency-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business
  namespace: unagency
spec:
  replicas: 2
  selector:
    matchLabels: { app: business }
  template:
    metadata:
      labels: { app: business }
    spec:
      containers:
        - name: business
          image: unagency/platform:1.0.0
          env:
            - { name: SERVICE_ROLE, value: business }
          envFrom:
            - configMapRef: { name: unagency-config }
            - secretRef: { name: unagency-secrets }
          ports: [{ containerPort: 3000 }]
---
