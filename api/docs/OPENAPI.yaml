components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ApiSuccess:
      type: object
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
      required:
      - data
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
      required:
      - error
    IssuedToken:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresInSec:
          type: number
        scheme:
          type: string
        sessionId:
          type: string
    ExecutionResource:
      type: object
      properties:
        executionId:
          type: string
        status:
          type: string
        organizationId:
          type: string
        workspaceId:
          type: string
        capabilityId:
          type: string
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        promptPreview:
          type: string
        cost:
          type: number
        evaluationScore:
          type: number
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: RBAC / tenant isolation denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
x-unagency:
  surfaces:
    enterpriseGateway: src/platform/api — in-process; nginx expects /v1|/v2
    legacyExpress: src/app.ts — live SaaS HTTP today
  streaming:
    note: GET /executions/{id}/stream returns SSE-shaped frames inside JSON success
      envelope; not a native text/event-stream socket in V1 inventory.
    transportsDocumented:
    - sse
    - websocket
    - chunked
    providerSpecificStreaming: false
