apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE_ROLE
              value: api
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: PERSISTENCE_DIALECT
              value: {{ .Values.env.PERSISTENCE_DIALECT | quote }}
            - name: OBSERVABILITY_ENABLED
              value: {{ .Values.env.OBSERVABILITY_ENABLED | quote }}
          envFrom:
            - secretRef: { name: {{ .Release.Name }}-secrets }
          ports:
            - containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.service.port }} }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: {{ .Values.service.type }}
  selector: { app: api }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
