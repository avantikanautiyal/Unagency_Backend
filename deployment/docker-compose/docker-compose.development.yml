# UNAGENCY — Development stack (Docker Compose)
name: unagency-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unagency
      POSTGRES_USER: unagency
      POSTGRES_PASSWORD: unagency_dev
    ports: ["5432:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unagency"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: unagency
      MONGO_INITDB_ROOT_PASSWORD: unagency_dev
    ports: ["27017:27017"]
    volumes: [mongodata_dev:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    environment:
      SERVICE_ROLE: migration
      MIGRATION_ENV: development
      PERSISTENCE_DIALECT: postgres
      DATABASE_URL: postgres://unagency:unagency_dev@postgres:5432/unagency
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    environment:
      SERVICE_ROLE: api
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://unagency:unagency_dev@postgres:5432/unagency
      MONGODB_URI: mongodb://unagency:unagency_dev@mongodb:27017/unagency?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["3000:3000"]
    depends_on:
      - migrate
      - redis
      - mongodb

  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    environment:
      SERVICE_ROLE: worker
      NODE_ENV: development
      DATABASE_URL: postgres://unagency:unagency_dev@postgres:5432/unagency
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on: [api, redis]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]

volumes:
  pgdata_dev:
  mongodata_dev:
