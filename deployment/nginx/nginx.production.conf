worker_processes auto;
events { worker_connections 4096; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  # Default is 1m: larger uploads get a 413 without CORS headers (browser shows a CORS error).
  client_max_body_size 100m;
  tcp_nopush on;
  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain application/json application/javascript text/css application/xml;

  upstream unagency_api {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
  }

  # nginx-generated errors (e.g. 413) never reach Express, so they need their own CORS header.
  map $http_origin $cors_error_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*unagency\.(app|io)$" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.unagency.io;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:50m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    error_page 413 = @payload_too_large;
    location @payload_too_large {
      add_header Access-Control-Allow-Origin $cors_error_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Vary Origin always;
      default_type application/json;
      return 413 '{"success":false,"message":"File is too large. Maximum upload size is 100 MB."}';
    }

    location /v1/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://unagency_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      limit_req zone=api_limit burst=200 nodelay;
      proxy_pass http://unagency_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      add_header Cache-Control "no-store" always;
    }

    location ~ ^/v[12]/executions/.+/stream {
      proxy_pass http://unagency_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      add_header Cache-Control "no-cache" always;
    }
  }
}
